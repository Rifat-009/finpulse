<style>
:root{--bg:#060b09;--bg2:#0c1410;--card:#111c17;--input:#0e1914;--bdr:#1b2f25;--bdr2:#254537;--t1:#e2ece6;--t2:#8ba396;--t3:#4f6b5c;--acc:#00e68a;--accd:rgba(0,230,138,.12);--accg:rgba(0,230,138,.25);--gld:#f0c040;--gldd:rgba(240,192,64,.12);--red:#ff4757;--redd:rgba(255,71,87,.12);--cyn:#00d2ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 20%,rgba(0,230,138,.03) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 85% 80%,rgba(240,192,64,.02) 0%,transparent 50%);pointer-events:none;z-index:0}

#sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--bg2);border-right:1px solid var(--bdr);z-index:50;display:flex;flex-direction:column;transition:transform .3s ease}
.logo{padding:22px 20px;display:flex;align-items:center;gap:12px}
.logo-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#00b36b);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 15px rgba(0,230,138,.25)}
.logo-text{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--t1);letter-spacing:-.3px}.logo-text span{color:var(--acc)}
#sidebar nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--t2);font-size:14px;font-weight:500;text-decoration:none;position:relative}
.ni:hover{background:var(--accd);color:var(--t1)}
.ni.act{background:var(--accd);color:var(--acc)}
.ni.act::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--acc);border-radius:0 3px 3px 0}
.ni i{width:20px;text-align:center;font-size:15px}
#sf{padding:16px 20px;border-top:1px solid var(--bdr)}
#mw{margin-left:240px;min-height:100vh;position:relative;z-index:1}
#tb{position:sticky;top:0;z-index:40;background:rgba(6,11,9,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
#tb h1{font-size:18px;font-weight:600}
#ct{padding:20px 24px 100px}
.cd{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:20px;transition:border-color .25s}.cd:hover{border-color:var(--bdr2)}
.sc{position:relative;overflow:hidden}.sc::after{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;opacity:.08}
.sc.g::after{background:var(--acc)}.sc.gl::after{background:var(--gld)}.sc.r::after{background:var(--red)}.sc.c::after{background:var(--cyn)}
.dt{width:100%;border-collapse:collapse;min-width:600px}
.dt th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);white-space:nowrap}
.dt td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(27,47,37,.4);vertical-align:middle;white-space:nowrap}
.dt tr:hover td{background:var(--accd)}.dt tr{cursor:pointer;transition:background .15s}
.ip{background:var(--input);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;color:var(--t1);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;width:100%}
.ip:focus{border-color:var(--acc)}.ip::placeholder{color:var(--t3)}

.bt{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.bt1{background:var(--acc);color:#060b09}.bt1:hover{background:#00cc7a;transform:translateY(-1px);box-shadow:0 4px 20px var(--accg)}
.bt2{background:var(--accd);color:var(--acc);border:1px solid var(--bdr)}.bt2:hover{background:var(--bdr)}
.btd{background:var(--redd);color:var(--red)}.btd:hover{background:rgba(255,71,87,.2)}
.bts{padding:6px 12px;font-size:12px;border-radius:8px}
.tg{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tgg{background:var(--accd);color:var(--acc)}.tgr{background:var(--redd);color:var(--red)}
.pb{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden}.pf{height:100%;border-radius:3px;transition:width .6s ease}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#mo.sh{display:flex}
#mc{background:var(--card);border:1px solid var(--bdr);border-radius:16px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;animation:mi .3s ease}
@keyframes mi{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
#tc{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.tt{padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;animation:ti .3s ease;display:flex;align-items:center;gap:10px;min-width:260px;border:1px solid var(--bdr);background:var(--card)}
.tt.s{border-color:var(--acc)}.tt.s i{color:var(--acc)}.tt.e{border-color:var(--red)}.tt.e i{color:var(--red)}.tt.i{border-color:var(--cyn)}.tt.i i{color:var(--cyn)}
@keyframes ti{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes to{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
.ld{width:7px;height:7px;background:var(--acc);border-radius:50%;display:inline-block;animation:lp 2s infinite}
@keyframes lp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
.pe{animation:pe .35s ease-out}
@keyframes pe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.sb{cursor:pointer;transition:all .2s;background:none;border:none;font-size:15px;color:var(--t3);padding:4px}.sb.a{color:var(--gld)}.sb:hover{transform:scale(1.2)}
#mn{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bdr);z-index:50;padding:4px 0 max(env(safe-area-inset-bottom), 4px)}

#mn .mi.a{color:var(--acc)}#mn .mi i{font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

@media(max-width:768px){
#sidebar{transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}

#mn{display:flex}.hm{display:none!important}
.g2,.g3{grid-template-columns:1fr!important}
}
@media(min-width:769px){#mt{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

function sSet(){const k=localStorage.getItem('fp_av')||'';smo(`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Stock API Settings</h2><p style="font-size:12px;color:var(--t2);margin-bottom:16px">Enter free Alpha Vantage key from <a href="https://www.alphavantage.co/support/#api-key" target="_blank" style="color:var(--acc)">alphavantage.co</a>.</p><input class="ip" id="av-k" placeholder="API Key..." value="${k}" style="margin-bottom:14px"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="bt bt2 bts" onclick="cmo()">Cancel</button><button class="bt bt1 bts" onclick="sAV()">Save</button></div>`)}

<div class="cd" style="margin-bottom:20px"><h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Add Transaction</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end"><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">Type</label><select class="ip" id="tx-tp" onchange="budTC()"><option value="ex">Expense</option><option value="in">Income</option></select></div><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">Category</label><select class="ip" id="tx-ct">${EC.map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')}</select></div><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">Desc</label><input class="ip" id="tx-ds" placeholder="For what?"></div><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">Amount</label><input class="ip" id="tx-am" type="number" min="0" step="0.01" placeholder="0.00"></div><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">Date</label><input class="ip" id="tx-dt" type="date" value="${new Date().toISOString().split('T')[0]}"></div><button class="bt bt1" onclick="aTx()" style="height:40px"><i class="fas fa-plus"></i> Add</button></div><div id="tx-er" style="color:var(--red);font-size:11px;margin-top:6px;display:none"></div></div>
<div class="cd" style="margin-bottom:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">Budget Limit:</span><input class="ip" style="width:120px" type="number" id="bl-in" value="${b.lim}" min="0" step="100"><button class="bt bt2 bts" onclick="uBL()">Update</button><button class="bt btd bts" onclick="cTx()" style="margin-left:auto"><i class="fas fa-trash"></i> Clear</button></div>
<div class="cd" style="padding:0;overflow-x:auto"><table class="dt"><thead><tr><th>Type</th><th>Category</th><th>Desc</th><th>Date</th><th style="text-align:right">Amount</th><th style="width:40px"></th></tr></thead><tbody>${[...b.tx].reverse().map(t=>{const c=CAT[t.ct]||CAT.other,ii=t.tp==='in';return`<tr><td><span class="tg ${ii?'tgg':'tgr'}" style="font-size:10px">${ii?'Income':'Expense'}</span></td><td style="font-size:12px"><i class="fas ${c.i}" style="color:${c.c};margin-right:4px"></i>${c.l}</td><td style="font-size:12px">${t.ds}</td><td style="font-size:12px;color:var(--t3)">${t.dt}</td><td style="text-align:right;font-weight:600;color:${ii?'var(--acc)':'var(--t1)'}">${ii?'+':'-'}${fU(t.am)}</td><td><button class="bt btd bts" style="padding:3px 6px;font-size:10px" onclick="dTx(${t.id})"><i class="fas fa-times"></i></button></td></tr>`}).join('')}</tbody></table>${b.tx.length===0?'<div style="text-align:center;padding:30px;color:var(--t3);font-size:13px">No transactions</div>':''}</div></div>`}
function budTC(){const cs=document.getElementById('tx-ct');if(!cs)return;const ii=document.getElementById('tx-tp').value==='in';cs.innerHTML=(ii?IC:EC).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')}
function aTx(){const tp=document.getElementById('tx-tp').value,ct=document.getElementById('tx-ct').value,ds=document.getElementById('tx-ds').value.trim(),am=parseFloat(document.getElementById('tx-am').value),dt=document.getElementById('tx-dt').value,er=document.getElementById('tx-er');if(!ds){er.textContent='Enter description';er.style.display='block';return}if(!am||am<=0){er.textContent='Enter valid amount';er.style.display='block';return}if(!dt){er.textContent='Select date';er.style.display='block';return}er.style.display='none';S.bud.tx.push({id:S.bud.ni++,tp,ct,ds,am,dt});ss('fp_bud',S.bud);toast(`${tp==='in'?'Income':'Expense'} added`,'s');go('budget')}
function dTx(id){S.bud.tx=S.bud.tx.filter(t=>t.id!==id);ss('fp_bud',S.bud);toast('Deleted','i');go('budget')}
function uBL(){const v=parseFloat(document.getElementById('bl-in').value);if(v&&v>0){S.bud.lim=v;ss('fp_bud',S.bud);toast('Limit updated','s');go('budget')}}
function cTx(){if(!S.bud.tx.length)return;smo(`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Clear All?</h2><p style="font-size:13px;color:var(--t2);margin-bottom:16px">Delete ${S.bud.tx.length} transactions?</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="bt bt2 bts" onclick="cmo()">Cancel</button><button class="bt btd bts" onclick="S.bud.tx=[];S.bud.ni=1;ss('fp_bud',S.bud);cmo();toast('Cleared','i');go('budget')">Clear</button></div>`)}

<div class="g2" style="margin-bottom:20px"><div class="cd"><h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Spending by Category</h3><div style="height:260px"><canvas id="cCP"></canvas></div></div><div class="cd"><h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Income vs Expenses</h3><div style="height:260px"><canvas id="cIE"></canvas></div></div></div>
<div class="g3"><div class="cd"><h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Monthly Trend</h3><div style="height:240px"><canvas id="cMT"></canvas></div></div><div class="cd"><h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Breakdown</h3>${ce.map(([k,v])=>{const c=CAT[k]||CAT.other,p=te>0?(v/te*100):0;return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px"><span style="color:var(--t2)"><i class="fas ${c.i}" style="color:${c.c};margin-right:4px;font-size:10px"></i>${c.l}</span><span style="color:var(--t3)">${fU(v)} (${fm(p,0)}%)</span></div><div class="pb"><div class="pf" style="width:${p}%;background:${c.c}"></div></div></div>`}).join('')}${ce.length===0?'<div style="text-align:center;padding:20px;color:var(--t3);font-size:13px">No data</div>':''}</div></div></div>`}
function iAna(){const ex=S.bud.tx.filter(t=>t.tp==='ex'),cs={};ex.forEach(t=>{cs[t.ct]=(cs[t.ct]||0)+t.am});const ce=Object.entries(cs).sort((a,b)=>b[1]-a[1]);if(ce.length>0)mD('cCP',ce.map(([k])=>CAT[k].l),ce.map(([,v])=>v),ce.map(([k])=>CAT[k].c));const h=[...S.hist];if(h.length>0){h[h.length-1].exp=ex.reduce((s,t)=>s+t.am,0);h[h.length-1].inc=S.bud.tx.filter(t=>t.tp==='in').reduce((s,t)=>s+t.am,0)}mB('cIE',h.map(x=>x.m),[{label:'Income',data:h.map(x=>x.inc),backgroundColor:'rgba(0,230,138,0.7)',borderRadius:6},{label:'Expenses',data:h.map(x=>x.exp),backgroundColor:'rgba(255,71,87,0.7)',borderRadius:6}]);mL('cMT',h.map(x=>x.m),[{label:'Expenses',data:h.map(x=>x.exp),borderColor:'#ff4757',backgroundColor:'rgba(255,71,87,0.1)',fill:true,borderWidth:2}],{sx:{y:{ticks:{callback:v=>'$'+fm(v,0)}}}})}

function pFx(){const r=S.rt;if(!r)return'<div class="pe" style="text-align:center;padding:60px;color:var(--t3)">Loading rates...</div>';const pop=['EUR','GBP','JPY','CAD','AUD','CHF','CNY','INR','KRW','BRL'],all=Object.keys(r).sort();
return`<div class="pe"><div class="cd" style="max-width:560px;margin:0 auto 20px"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px;text-align:center">Currency Converter</h3><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end"><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">From</label><select class="ip" id="cv-f" onchange="dCv()"><option value="USD">USD</option>${all.filter(c=>c!=='USD').map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div style="padding-bottom:6px"><button onclick="const f=document.getElementById('cv-f'),t=document.getElementById('cv-t'),v=f.value;f.value=t.value;t.value=v;dCv()" style="background:var(--accd);border:1px solid var(--bdr);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--acc)"><i class="fas fa-exchange-alt"></i></button></div><div><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">To</label><select class="ip" id="cv-t" onchange="dCv()">${all.map(c=>`<option value="${c}" ${c==='EUR'?'selected':''}>${c}</option>`).join('')}</select></div></div><div style="margin-top:14px"><label style="font-size:11px;color:var(--t3);display:block;margin-bottom:3px">Amount</label><input class="ip" id="cv-a" type="number" min="0" step="any" value="1000" oninput="dCv()" style="font-size:16px;font-weight:600;padding:12px"></div><div id="cv-r" style="margin-top:16px;text-align:center;padding:16px;background:var(--input);border-radius:12px;border:1px solid var(--bdr)"><div style="font-size:11px;color:var(--t3);margin-bottom:4px">Converted</div><div style="font-size:28px;font-weight:700;font-family:'Space Grotesk';color:var(--acc)">—</div><div id="cv-rt" style="font-size:11px;color:var(--t3);margin-top:4px"></div></div></div>

function dCv(){const f=document.getElementById('cv-f')?.value,t=document.getElementById('cv-t')?.value,a=parseFloat(document.getElementById('cv-a')?.value)||0,r=S.rt;if(!r||!f||!t)return;const iu=f==='USD'?a:a/r[f],res=t==='USD'?iu:iu*r[t],rate=t==='USD'?(1/r[f]):(r[t]/r[f]),re=document.getElementById('cv-r'),ra=document.getElementById('cv-rt');if(re)re.innerHTML=`<div style="font-size:11px;color:var(--t3);margin-bottom:4px">Converted</div><div style="font-size:28px;font-weight:700;font-family:'Space Grotesk';color:var(--acc)">${fm(res,t==='JPY'||t==='KRW'?0:2)} ${t}</div>`;if(ra)ra.textContent=`1 ${f} = ${fm(rate,t==='JPY'||t==='KRW'?2:4)} ${t}`}

const TI={dash:'Dashboard',crypto:'Crypto Market',stocks:'Stock Tracker',budget:'Budget Manager',analytics:'Analytics',fx:'Currency Converter'};
function go(p){Object.keys(S.ch).forEach(dCh);S.p=p;const ct=document.getElementById('ct'),tt=document.getElementById('pt');document.getElementById('sidebar').classList.remove('open');
switch(p){case'dash':ct.innerHTML=pDash();iDash();break;case'crypto':ct.innerHTML=pCrypto();iCrypto();break;case'stocks':ct.innerHTML=pStocks();iStocks();break;case'budget':ct.innerHTML=pBud();break;case'analytics':ct.innerHTML=pAna();iAna();break;case'fx':ct.innerHTML=pFx();iFx();break}

setInterval(()=>{tSt();if(S.p==='stocks')iStocks()},4000);

toast('Dashboard loaded','s')}
init();
